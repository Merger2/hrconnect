# HRConnect — Nginx server block: HTTPS + redirect + security headers
# =====================================================================
# INSTALL:
#   1. sudo cp deploy/nginx/hrconnect-ssl.conf /etc/nginx/sites-available/hrconnect
#   2. Sesuaikan: server_name, ssl_certificate paths, root, fastcgi_pass (php-fpm version)
#   3. sudo ln -s /etc/nginx/sites-available/hrconnect /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Pastikan .env: APP_URL=https://your-domain (wajib — URL absolut untuk email/PWA)
#
# Certbot (Let's Encrypt):
#   sudo certbot --nginx -d your-domain -d www.your-domain
#   # atau manual: buat server block HTTP dulu (port 80) → certbot --nginx → file ini di-aktifkan

# --- HTTP → HTTPS redirect (port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name your-domain www.your-domain;

    # Redirect semua HTTP ke HTTPS (kecuali ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain www.your-domain;

    # TLS certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (aktifkan setelah HTTPS stabil; preload setelah submit ke hstspreload.org)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers (app juga set via middleware EnsureSecurityHeaders —
    # duplicate di Nginx = defense-in-depth untuk asset statis & non-PHP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;

    root /var/www/hrconnect/public;
    index index.php;
    charset utf-8;

    # Upload size (face images, dokumen, payslip PDF)
    client_max_body_size 20M;

    # Laravel: semua request ke front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (versi sesuaikan: php8.5-fpm dll)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;   # request panjang (AI KB, import/export, PDF payroll) — default 60s -> 504
    }

    # Asset statis — cache panjang (Vite hashed filenames)
    # NOTE: blok ini mendeklarasikan add_header sendiri → TIDAK mewarisi header
    # server-level (HSTS/X-Frame dll) untuk asset. Dampak minimal (asset statis
    # tidak butuh header itu) dan Cache-Control di sini lebih penting.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # PWA — manifest & service worker JANGAN di-cache browser (update cepat)
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # File sensitif Laravel — block akses langsung
    location ~* ^/(?:\.env|storage/logs|bootstrap/cache|config/|database/) {
        deny all;
        return 403;
    }
    location ~ /\. {
        deny all;
        return 403;
    }

    # --- Kompresi (WAJIB — hemat 60-70% transfer size) ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # brotli (opsional, jika nginx-mod-brotli terpasang):
    # brotli on; brotli_comp_level 6; brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- OPSIONAL: Reverb WebSocket proxy (hanya jika BROADCAST_CONNECTION=reverb) ---
    # location /app {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 86400;
    # }

    access_log /var/log/nginx/hrconnect-access.log;
    error_log  /var/log/nginx/hrconnect-error.log;
}
