; HRConnect — Supervisor: Queue Worker (WAJIB)
; =============================================
; Menjalankan queue worker terus-menerus (QUEUE_CONNECTION=database).
; Queue "maintenance" dipakai backup pipeline, "default" untuk notifikasi,
; PDF, import/export, dan job lain.
;
; INSTALL:
;   sudo cp deploy/supervisor/hrconnect-worker.conf /etc/supervisor/conf.d/
;   sudo sed -i "s|/var/www/hrconnect|/path/to/your/app|g" /etc/supervisor/conf.d/hrconnect-worker.conf
;   sudo sed -i "s|www-data|www-data|g" /etc/supervisor/conf.d/hrconnect-worker.conf   # ganti user bila perlu
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status
;
; VERIFIKASI:
;   supervisorctl tail -100 hrconnect-worker:hrconnect-worker_00
;   php artisan queue:monitor      # jumlah antrean (opsional, butuh config queue-monitor)
;
; NOTE: routes/console.php juga punya queue:work --stop-when-empty tiap menit
; sebagai fallback (gate SCHEDULE_QUEUE_WORKER). Dengan supervisor aktif,
; set SCHEDULE_QUEUE_WORKER=false di .env supaya tidak double-consume.

[program:hrconnect-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hrconnect/artisan queue:work database --queue=maintenance,default --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/hrconnect
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/hrconnect-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
