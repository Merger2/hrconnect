; HRConnect — Supervisor: Reverb WebSocket Server (OPSIONAL)
; ============================================================
; Hanya dibutuhkan jika BROADCAST_CONNECTION=reverb (real-time notifikasi,
; kolaborasi, dll). Default .env.example = log (realtime nonaktif).
;
; Jika tidak memakai Reverb, SKIP file ini — jangan di-copy ke /etc/supervisor.
;
; INSTALL (bila dipakai):
;   .env:  BROADCAST_CONNECTION=reverb
;          REVERB_SERVER_HOST=0.0.0.0
;          REVERB_SERVER_PORT=8080
;          REVERB_APP_ID=hrconnect
;          REVERB_APP_KEY=<acak 32+ char>
;          REVERB_APP_SECRET=<acak 32+ char>
;          VITE_REVERB_APP_KEY=<sama dengan REVERB_APP_KEY>
;          VITE_REVERB_HOST=<domain websocket, mis. ws.example.com>
;          VITE_REVERB_PORT=443
;          VITE_REVERB_SCHEME=https
;   Nginx: proxy /app dan /apps ke 127.0.0.1:8080 (lihat deploy/nginx/hrconnect-ssl.conf)
;   Lalu:
;   sudo cp deploy/supervisor/hrconnect-reverb.conf /etc/supervisor/conf.d/
;   sudo sed -i "s|/var/www/hrconnect|/path/to/your/app|g" /etc/supervisor/conf.d/hrconnect-reverb.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; VERIFIKASI:
;   sudo supervisorctl tail -50 hrconnect-reverb:hrconnect-reverb_00
;   curl -s http://127.0.0.1:8080/apps/hrconnect 2>/dev/null | head -1
;   # harus ada respons JSON {"app":true,...} — port 8080 hanya internal (jangan expose publik)

[program:hrconnect-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hrconnect/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/hrconnect
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/hrconnect-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10
