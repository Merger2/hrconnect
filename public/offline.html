<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>Offline | HRConnect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1c1b1b;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            align-items: center;
            justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }
        .panel {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .brand img { width: 44px; height: 44px; border-radius: 12px; }
        .brand strong { font-size: 1.25rem; font-weight: 600; }
        .brand span { font-size: 0.75rem; color: #6b6b6b; display: block; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
        p { font-size: 0.875rem; color: #6b6b6b; line-height: 1.6; margin-bottom: 1.5rem; }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            background: #0a0a0a;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        .button:hover { opacity: 0.85; }
        .button-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            background: transparent;
            color: #1c1b1b;
            border: 1px solid #d9d9d9;
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }
        .button-secondary:hover { background: #f5f5f5; }
        .actions { margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="brand">
            <img src="/icon-192.svg" alt="HRConnect">
            <div>
                <strong>HRConnect</strong>
                <span>Mode offline</span>
            </div>
        </div>
        <span class="icon">📡</span>
        <h1>Koneksi terputus</h1>
        <p>HRConnect tidak dapat terhubung ke server. Periksa koneksi internet Anda dan coba lagi.</p>
        <div class="actions">
            <button class="button" onclick="window.location.reload()">Coba lagi</button>
            <a class="button-secondary" href="/">Kembali ke Beranda</a>
        </div>
    </div>
</body>
</html>
