---
env:
  contexts:
    - name: "hrconnect-full"
      urls:
        - "http://127.0.0.1:8000"
      excludePaths:
        - ".*\\.css"
        - ".*\\.js"
        - ".*\\.png"
        - ".*\\.jpg"
        - ".*\\.gif"
        - ".*\\.svg"
        - ".*\\.ico"
        - ".*\\.woff"
        - ".*\\.woff2"
        - ".*\\.ttf"
        - ".*\\.eot"
        - ".*storage/.*"
        - ".*\\.xml"
      authentication:
        method: "form"
        parameters:
          loginUrl: "http://127.0.0.1:8000/login"
          loginRequestData: "email={%username%}&password={%password%}&_token={%csrfToken%}"
          logoutUrl: "http://127.0.0.1:8000/logout"
        verification:
          method: "response"
          loggedInRegex: "\\QDashboard\\E|\\Qhome\\E|\\Qprofil\\E"
          loggedOutRegex: "\\QLogin\\E|\\Qlogin\\E"
      sessionManagement:
        method: "cookie"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  # Step 1: Spider as Employee
  - parameters:
      url: "http://127.0.0.1:8000"
      maxDuration: 5
      maxDepth: 0
      maxChildren: 0
      recurse: true
      subtreeOnly: false
    type: spider
    name: "spider-employee"

  # Wait for spider to finish
  - parameters:
      maxDuration: 0
    type: passiveScan-wait

  # Step 2: Full Active Scan
  - parameters:
      maxRuleDurationInMins: 0
      maxScanDurationInMins: 60
      recurse: true
      childFirst: false
      inScopeOnly: true
      threadPerHost: 5
      delayInMs: 0
      handleAntiCsrfTokens: true
      injectPluginIdInHeader: false
      requestWaitTimeInMs: 200
      seeds: []
      strength: "HIGH"
      alertThreshold: "LOW"
    type: activeScan
    name: "active-scan-full"

  # Wait for active scan to finish
  - parameters:
      maxDuration: 0
    type: passiveScan-wait

  # Generate reports
  - parameters:
      reportDescription: "HRConnect Full Security Scan - All Roles"
      reportDir: "/zap/wrk/"
      reportFile: "hrconnect-full-scan.html"
      reportTitle: "HRConnect Security Scan Report - Full Active Scan"
      template: "traditional-html"
    type: report

  - parameters:
      reportDescription: "HRConnect Full Security Scan - All Roles"
      reportDir: "/zap/wrk/"
      reportFile: "hrconnect-full-scan.json"
      reportTitle: "HRConnect Security Scan Report"
      template: "traditional-json"
    type: report

  - parameters:
      reportDescription: "HRConnect Full Security Scan - All Roles"
      reportDir: "/zap/wrk/"
      reportFile: "hrconnect-full-scan.xml"
      reportTitle: "HRConnect Security Scan Report"
      template: "traditional-xml"
    type: report
