# HRConnect Nginx configuration
# Instalasi: cp docs/deployment/nginx.conf /etc/nginx/sites-available/hrconnect
#           ln -s /etc/nginx/sites-available/hrconnect /etc/nginx/sites-enabled/
# Test:      nginx -t
# Reload:    systemctl reload nginx
#
# Catatan: Security headers (CSP, HSTS, dll) sudah di-handle oleh Laravel middleware
#          (EnsureSecurityHeaders). Nginx hanya menyediakan header minimal.

server {
    listen 80;
    server_name hrconnect.company.com;
    root /var/www/hrconnect/public;

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Asset cache (1 year immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest
    location /manifest.json {
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    # Service worker (no cache)
    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
